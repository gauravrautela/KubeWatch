# KubeWatch agent — Deployment + Service.
#
# This is the workload the ValidatingWebhookConfiguration's clientConfig.service
# points at (Service "kubewatch-agent", namespace "kubewatch", port 8443, path
# /webhook). Apply agent-rbac.yaml first (Namespace, ServiceAccount, token Secret).
#
# Prerequisites to fill in:
#   * <IMAGE>            container image for the agent binary (./cmd/agent)
#   * <HUB_URL>          the hub ingest endpoint, e.g. https://kubewatch-hub.<hub-ns>.svc:8080/v1/events
#                        (or an external, TLS-terminated URL if the hub is in another cluster)
#   * kubewatch-agent-tls  a Secret with tls.crt/tls.key whose SAN is
#                          kubewatch-agent.kubewatch.svc, PROVIDED EXTERNALLY.
#
# TLS is mandatory: the API server calls admission webhooks only over HTTPS and
# verifies the agent's cert against the webhook config's caBundle. Provisioning
# that cert is intentionally left OUT of these manifests — supply the
# kubewatch-agent-tls Secret with your own tooling (cert-manager, a bootstrap
# job, or a hand-generated cert), and set the webhook's caBundle to the CA that
# signed it. This keeps cert lifecycle an operator concern, not KubeWatch's.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-agent
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-agent
spec:
  # 2 replicas for availability: with the webhook's failurePolicy: Ignore, agent
  # downtime means missed changes, so a second replica shrinks that gap. Each
  # AdmissionReview is routed to a single pod, so there is no double-recording.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewatch-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-agent
    spec:
      serviceAccountName: kubewatch-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: gauravrautela/kubewatch-agent:v1            # e.g. ghcr.io/gauravrautela/kubewatch-agent:<TAG>
          args: []                  # the binary reads config from env (below)
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: WEBHOOK_ADDR
              value: ":8443"
            - name: HUB_URL
              value: "<HUB_URL>"
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubewatch-agent-token
                  key: CLUSTER_TOKEN
            - name: TLS_CERT_FILE
              value: "/etc/kubewatch/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/kubewatch/tls/tls.key"
            - name: LOG_LEVEL
              value: "info"          # set to "debug" to see per-change and retry logs
          volumeMounts:
            - name: tls
              mountPath: /etc/kubewatch/tls
              readOnly: true
          # /healthz is served over the same TLS listener, so probes use HTTPS.
          # The kubelet does not verify the serving cert for probes.
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: kubewatch-agent-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kubewatch-agent
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-agent
spec:
  selector:
    app.kubernetes.io/name: kubewatch-agent
  ports:
    # Port 8443 matches clientConfig.service.port in the
    # ValidatingWebhookConfiguration. The API server connects here.
    - name: https
      port: 8443
      targetPort: https
# ---
# TLS Secret (kubewatch-agent-tls) is intentionally NOT defined here — provide it
# externally (see the header note). Its cert SAN must be
# kubewatch-agent.kubewatch.svc, and the ValidatingWebhookConfiguration's caBundle
# must be the CA that signed it.
