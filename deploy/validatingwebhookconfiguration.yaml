apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubewatch-agent
webhooks:
  - name: changes.kubewatch.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore          # never block cluster operations
    timeoutSeconds: 2
    clientConfig:
      service:
        name: kubewatch-agent
        namespace: kubewatch
        path: /webhook
        port: 8443
      # CA that signed the agent's serving cert (kubewatch-agent-tls Secret):
      # base64 -i ca.crt | tr -d '\n'  — see deploy/README.md Part 2 step 4.
      # Environment-specific: keep the filled-in copy under deploy/test/ (gitignored).
      caBundle: <BASE64_CA_BUNDLE>
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: "*"
