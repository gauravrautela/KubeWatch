# KubeWatch hub — central backend (ingest API + ClickHouse writer).
# Runs on the hub cluster in namespace kubewatch (created by clickhouse.yaml).
# Agents on spoke clusters POST events to this hub, so it must be reachable from
# them — expose it via an Ingress/LoadBalancer (a ClusterIP Service is defined
# here; add your ingress in front, terminating TLS since agents send a bearer token).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewatch-hub
  namespace: kubewatch
# No rules: the hub needs no Kubernetes API access (it talks to ClickHouse and
# serves HTTP only).
---
# Sensitive hub config: the per-cluster agent tokens. The ClickHouse DSN is NOT
# stored here — it is composed in the Deployment env below from the
# clickhouse-credentials Secret (created out-of-band; see clickhouse.yaml), so
# this file never contains the password and is always safe to re-apply.
apiVersion: v1
kind: Secret
metadata:
  name: kubewatch-hub-config
  namespace: kubewatch
type: Opaque
stringData:
  # token=cluster pairs the hub accepts, comma-separated. One token per spoke.
  # Generate with: openssl rand -hex 32. Do NOT commit real tokens — keep the
  # filled-in copy under deploy/test/ (gitignored).
  AGENT_TOKENS: "<TOKEN>=<CLUSTER_NAME>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-hub
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewatch-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewatch-hub
    spec:
      serviceAccountName: kubewatch-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: ghcr.io/gauravrautela/kubewatch-hub:sha-173d2e8   # published by .github/workflows/docker.yml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: LOG_LEVEL
              value: "info"
            # CLICKHOUSE_PASSWORD must be defined BEFORE CLICKHOUSE_DSN so the
            # $(CLICKHOUSE_PASSWORD) reference below expands (Kubernetes only
            # expands env vars declared earlier in the list).
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials   # created out-of-band, see clickhouse.yaml
                  key: password
            - name: CLICKHOUSE_DSN
              value: "clickhouse://default:$(CLICKHOUSE_PASSWORD)@clickhouse.kubewatch.svc:9000/default"
          envFrom:
            - secretRef:
                name: kubewatch-hub-config   # AGENT_TOKENS
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kubewatch-hub
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch-hub
spec:
  selector:
    app.kubernetes.io/name: kubewatch-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
